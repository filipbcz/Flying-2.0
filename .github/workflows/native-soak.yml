name: Native Soak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  soak:
    name: Native soak tests
    runs-on: windows-latest
    timeout-minutes: 720
    env:
      FLYING_RUNTIME_NETWORK: "OFF"
      FLYING_REQUIRE_MAP_API_KEYS: "OFF"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure native test preset
        run: cmake --preset test

      - name: Build native test preset
        run: cmake --build --preset test

      - name: Run soak tests
        run: ctest --preset soak --output-on-failure
