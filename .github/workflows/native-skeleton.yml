name: Native Skeleton

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    name: Native modules and smoke test
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      FLYING_RUNTIME_NETWORK: "OFF"
      FLYING_REQUIRE_MAP_API_KEYS: "OFF"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure native test preset
        run: cmake --preset test

      - name: Build native test preset
        run: cmake --build --preset smoke

      - name: Run smoke test
        run: ctest --preset smoke --output-on-failure
