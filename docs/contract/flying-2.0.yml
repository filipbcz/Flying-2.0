{
  "schemaVersion": "flying.contract.v1",
  "contractId": "flying-2.0",
  "status": "immutable",
  "contractDeltaVersion": 4,
  "project": {
    "name": "Flying",
    "platform": "Win64 desktop",
    "runtime": "offline Win64 flight simulator using installed regional packages; the first release package is Czech",
    "engine": "Unreal Engine 5.8 C++",
    "physicsCore": "standalone deterministic CoreSim/JSBSim",
    "terrainRuntime": "Cesium for Unreal 2.28+ with manifest-backed regional packages"
  },
  "authoritativeDocumentation": {
    "currentSources": [
      "docs/contract/flying-2.0.yml",
      "docs/governance/v1-scope-freeze.md",
      "docs/release/data-transformation-protocol.md",
      "data_pipeline/README.md"
    ],
    "taskContext": "AGENTS.md is non-authoritative for this regional scope update; it may describe legacy roadmap context but does not override this contract."
  },
  "regionalDataScope": {
    "defaultModel": "GIS source data and generated terrain, imagery, vector, map and runtime package outputs are regional by default, selected by explicit region configuration and stored under configured data roots outside Git-tracked repository content.",
    "supersededAssumption": "Prior whole-Czech-Republic GIS packaging assumptions are superseded for the Raspberry Pi target. Full-country coverage may remain a product goal or separately configured package mode, but it is not the default pipeline, storage or acceptance baseline for constrained hardware.",
    "pilotRegion": "Ceska Trebova is the first checked-in 10 x 10 km pilot region configuration used to prove the end-to-end process. Ceska Trebova coordinates must not be hard-coded into architecture or pipeline logic."
  },
  "invariants": [
    "Version 1 required geographic content is distributed as independently installable offline regional packages described by explicit versioned region configurations.",
    "The first production package is the 10 x 10 km Ceska Trebova pilot region, but application code, data models, paths and algorithms must not hard-code Ceska Trebova or any other region-specific assumption.",
    "Runtime flight inside an installed region package must not depend on external map APIs, public tile servers or source GIS download/normalization pipelines.",
    "All region-aware tools and release gates must accept an explicit region manifest or package manifest path.",
    "Production Unreal content requires versioned usable assets or an authorized reproducible content-build that creates identical runtime content from audited sources; manifests or missing external files alone are not production content evidence.",
    "Runtime visual acceptance evidence must be captured from the current real signed Win64 Unreal Shipping build and tied to both commit SHA and build id.",
    "Aircraft visual presentation proof must show CoreSim authoritative WGS-84 ECEF snapshots driving the rendered aircraft transform; presentation-owned transforms are not a substitute.",
    "The contract, roadmap and evidence ledger must stay synchronized for every active immutable requirement, including blocker-backed requirements."
  ],
  "governance": {
    "changeProcess": "mandatory requirements may change only by approved versioned contract update",
    "completionRule": "mandatory release gates must link to proof or an external blocker before completion",
    "prohibitedSubstitutes": [
      "external public map API or public tile server for required scenery or map runtime",
      "runway geometry inferred only from ARP, runway name and length",
      "ordinary DEM as authoritative runway physical surface",
      "community or sample JSBSim aircraft model as proof of physical fidelity",
      "visual clouds or particles as the only weather model",
      "cockpit instruments reading raw truth state instead of sensor models",
      "random health points as the basis for failures or damage",
      "unlicensed AIP/VFR redistribution or unrecorded data provenance",
      "unsigned development build as release candidate evidence",
      "hard-coded Ceska Trebova coordinates, paths or algorithms outside approved pilot region configuration",
      "whole-country source downloads or repository-stored GIS datasets as hidden prerequisites for regional package generation",
      "synthetic renders, headless captures, test images or non-Shipping builds as production visual acceptance evidence",
      "visible placeholder assets or primitive meshes in required visual acceptance scenes",
      "manifest-only regional or Unreal content in place of usable production assets or an authorized reproducible content-build",
      "fixture-generated pilot regional package as evidence for production Ceska Trebova coverage",
      "stale visual captures from a different commit or build id as current release evidence",
      "presentation-owned aircraft transforms as a substitute for CoreSim authoritative ECEF snapshots"
    ]
  },
  "milestones": [
    {
      "id": "M0",
      "name": "Contract, Legal And Data Gates",
      "requiredRequirementIds": [
        "REQ-CONTRACT-GOVERNANCE",
        "REQ-EVIDENCE-TRACEABILITY",
        "REQ-AUTHORITATIVE-DOCS"
      ],
      "exitGate": "legal, data provenance and aircraft data blockers are recorded before production claims"
    },
    {
      "id": "M1",
      "name": "Core Simulation And Vertical Slice",
      "requiredRequirementIds": [
        "REQ-EVIDENCE-TRACEABILITY"
      ],
      "exitGate": "headless simulation, initial terrain, airport, replay and telemetry evidence is recorded"
    },
    {
      "id": "M2",
      "name": "Production Content And Systems",
      "requiredRequirementIds": [
        "REQ-EVIDENCE-TRACEABILITY",
        "REQ-REGIONAL-GIS",
        "REQ-DMR-TERRAIN-COVERAGE",
        "REQ-REGIONAL-DATA-PACKAGES",
        "REQ-PILOT-REGION",
        "REQ-PRODUCTION-UNREAL-CONTENT",
        "REQ-PRODUCTION-PILOT-REGIONAL-PACKAGE"
      ],
      "exitGate": "production aircraft, configured regional package evidence, usable Unreal content or authorized reproducible content-build evidence, regional airport coverage, weather and cockpit evidence is recorded"
    },
    {
      "id": "M3",
      "name": "Packaging, Licensing And Quality Gates",
      "requiredRequirementIds": [
        "REQ-EVIDENCE-TRACEABILITY",
        "REQ-RUNTIME-SHIPPING-VISUAL-EVIDENCE",
        "REQ-AIRCRAFT-ECEF-VISUAL-AUTHORITY"
      ],
      "exitGate": "performance, stability, installer, signing, SBOM, visual quality, ECEF-driven presentation proof and license evidence is recorded"
    },
    {
      "id": "M4",
      "name": "Release Candidate Acceptance",
      "requiredRequirementIds": [
        "REQ-RELEASE-GATES"
      ],
      "exitGate": "release candidate is blocked unless every mandatory clean-machine, automated, coverage, validation, performance and soak result passes"
    }
  ],
  "requirements": [
    {
      "id": "REQ-CONTRACT-GOVERNANCE",
      "title": "Immutable Contract Governance",
      "mandatory": true,
      "milestone": "M0",
      "summary": "Maintain a versioned contract, milestone gates, approved change process, prohibited substitutes and explicit blockers for mandatory obligations.",
      "evidenceGate": "must have linked proof or blocker before milestone completion"
    },
    {
      "id": "REQ-EVIDENCE-TRACEABILITY",
      "title": "Requirement Evidence Traceability",
      "mandatory": true,
      "milestone": "M0",
      "summary": "Every requirement links to concrete proof or an external blocker, failed mandatory evidence blocks release, and the contract, roadmap and evidence ledger stay synchronized for all active requirements.",
      "evidenceGate": "must have exactly one current ledger entry with linked proof or blocker for every active immutable requirement before milestone completion"
    },
    {
      "id": "REQ-RELEASE-GATES",
      "title": "Final Release Gates",
      "mandatory": true,
      "milestone": "M4",
      "summary": "Release completes only when performance, physics, regional terrain packages, regional airport coverage, legal/license, production visual quality from the signed Win64 Unreal Shipping build, stability, installer, replay, telemetry, privacy and end-to-end workflow gates pass for the pilot release package.",
      "evidenceGate": "must have linked proof and passing mandatory gate results for release"
    },
    {
      "id": "REQ-AUTHORITATIVE-DOCS",
      "title": "Authoritative Documentation Alignment",
      "mandatory": true,
      "milestone": "M0",
      "summary": "Current authoritative Flying 2.0 documentation records regional GIS scope and treats AGENTS.md as non-authoritative task context.",
      "evidenceGate": "must have updated documentation proving the active regional contract before dependent implementation work"
    },
    {
      "id": "REQ-REGIONAL-GIS",
      "title": "Regional GIS Pipeline",
      "mandatory": true,
      "milestone": "M2",
      "summary": "GIS source discovery, normalization and generated runtime packages are selected by region and configured margins, not by complete Czech Republic download or local storage by default.",
      "evidenceGate": "must have region configuration, source-selection evidence and package manifests before production terrain claims"
    },
    {
      "id": "REQ-DMR-TERRAIN-COVERAGE",
      "title": "Regional DMR Terrain Coverage",
      "mandatory": true,
      "milestone": "M2",
      "summary": "Provide offline DMR 5G-based terrain coverage for each installed configured region, including the first 10 x 10 km Ceska Trebova pilot region, with LOD, water/material masks, normals, collision tiles, metadata and seam validation.",
      "evidenceGate": "must have region package terrain manifests and validation reports before production terrain claims"
    },
    {
      "id": "REQ-REGIONAL-DATA-PACKAGES",
      "title": "Configurable Offline Regional Packages",
      "mandatory": true,
      "milestone": "M2",
      "summary": "Geographic content is distributed as independently installable offline regional packages described by versioned region configurations; the first release includes the Ceska Trebova 10 x 10 km pilot package without hard-coded Czech-only or Ceska Trebova-specific application logic.",
      "evidenceGate": "must have explicit region manifests, package manifests and runtime compatibility checks before release"
    },
    {
      "id": "REQ-PRODUCTION-UNREAL-CONTENT",
      "title": "Production Unreal Content",
      "mandatory": true,
      "milestone": "M2",
      "summary": "Production visual content is proved by versioned usable Unreal assets or an authorized reproducible content-build that creates identical usable runtime content from audited sources; manifest-only or missing external content is not evidence.",
      "evidenceGate": "must have usable production assets or reproducible content-build evidence with audited source provenance before production visual acceptance"
    },
    {
      "id": "REQ-PRODUCTION-PILOT-REGIONAL-PACKAGE",
      "title": "Production Pilot Regional Package",
      "mandatory": true,
      "milestone": "M2",
      "summary": "The Ceska Trebova pilot regional package used for production acceptance is built from licensed source payloads with complete manifest provenance, checksums, attribution, schema versioning and offline runtime compatibility evidence.",
      "evidenceGate": "must have licensed source manifests and generated production package manifests before treating the pilot region as production coverage"
    },
    {
      "id": "REQ-RUNTIME-SHIPPING-VISUAL-EVIDENCE",
      "title": "Runtime Shipping Visual Evidence",
      "mandatory": true,
      "milestone": "M3",
      "summary": "Production visual acceptance evidence is captured from the current real signed Win64 Unreal Shipping build, records commit SHA, build id, graphics profile, scenario id, artifact path and performance metrics, and rejects synthetic, stale or non-Shipping captures.",
      "evidenceGate": "must have current signed Shipping runtime visual evidence before visual acceptance or release completion"
    },
    {
      "id": "REQ-AIRCRAFT-ECEF-VISUAL-AUTHORITY",
      "title": "Aircraft ECEF Visual Authority",
      "mandatory": true,
      "milestone": "M3",
      "summary": "Aircraft rendering is proven to follow CoreSim authoritative WGS-84 ECEF double-precision snapshots through the presentation bridge; presentation-owned transforms cannot substitute for physics authority.",
      "evidenceGate": "must have runtime proof linking rendered aircraft transforms to CoreSim ECEF snapshots before aircraft visual acceptance"
    },
    {
      "id": "REQ-PILOT-REGION",
      "title": "Ceska Trebova Pilot Region",
      "mandatory": true,
      "milestone": "M2",
      "summary": "The first milestone for the regional GIS pipeline is a complete end-to-end 10 x 10 km Ceska Trebova pilot package; the pilot is configuration data, not architecture logic.",
      "evidenceGate": "must have pilot region package evidence before broader regional rollout claims"
    }
  ],
  "evidenceLedger": {
    "schema": "docs/evidence/ledger.schema.json",
    "missingMandatoryEvidenceBehavior": "block_release",
    "externalBlockersFile": "docs/blockers/external-inputs.yml"
  }
}
